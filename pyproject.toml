[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerctl"
version = "0.1.0"
description = "Append-only ledger monitoring for decomposed-attack detection in AI control settings."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
gpu = ["vllm>=0.6.0"]

[tool.setuptools.packages.find]
include = ["ledgerctl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
